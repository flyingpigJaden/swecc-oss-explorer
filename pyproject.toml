[project]
name = "swecc-oss-explorer"
version = "0.1.0"
description = "A searchable, live issues browser across SWECC repos and the most active open-source projects on GitHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SWECC" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.31",
]

[project.scripts]
swecc-oss = "swecc_oss_explorer.cli:app"

[project.urls]
Homepage = "https://github.com/swecc-uw/swecc-oss-explorer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swecc_oss_explorer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in parameter defaults is the standard Typer idiom.
"src/swecc_oss_explorer/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
